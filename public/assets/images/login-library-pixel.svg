<rect x="1190" y="520" width="70" height="100" fill="#426d4a"/><path d="M1225 520q-90-95-70-130q70 18 70 130q-15-125 40-155q28 60-40 155q40-110 100-92q-8 72-100 92" fill="#78a85d"/>
