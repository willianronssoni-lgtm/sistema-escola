<g fill="#254735"><rect x="0" y="18" width="18" height="650"/><rect x="492" y="18" width="18" height="650"/></g>
<!-- right shelves -->
<rect x="1280" y="0" width="320" height="790" fill="#1c382d"/>
<rect x="1300" y="0" width="300" height="710" fill="url(#books)"/>
<g fill="#62864f"><rect x="1280" y="0" width="320" height="18"/><rect x="1280" y="220" width="320" height="20"/><rect x="1280" y="448" width="320" height="20"/><rect x="1280" y="676" width="320" height="22"/></g>
<!-- large sunny window -->
<rect x="720" y="0" width="560" height="560" fill="#557b64"/>
<rect x="740" y="0" width="520" height="530" fill="#9bbd91"/>
<rect x="750" y="0" width="500" height="510" fill="#f4c77f"/>
