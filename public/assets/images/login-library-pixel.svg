<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#203b31"/><stop offset="1" stop-color="#10251f"/></linearGradient>
 <linearGradient id="sun" x2="0" y2="1"><stop stop-color="#ffe5a0" stop-opacity=".9"/><stop offset="1" stop-color="#d88d4a" stop-opacity=".08"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#29483a"/><stop offset="1" stop-color="#10251f"/></linearGradient>
 <pattern id="pixel" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0h8v8H0z" fill="#fff" opacity=".018"/></pattern>
 <pattern id="books" width="82" height="112" patternUnits="userSpaceOnUse">
  <rect x="4" y="10" width="15" height="85" fill="#315a45"/><rect x="7" y="14" width="3" height="78" fill="#8dbb79"/>
  <rect x="22" y="4" width="18" height="91" fill="#426b4c"/><rect x="26" y="11" width="3" height="78" fill="#d69a62"/>
  <rect x="43" y="15" width="14" height="80" fill="#345b4a"/><rect x="46" y="19" width="3" height="70" fill="#a8c58b"/>
  <rect x="60" y="8" width="17" height="87" fill="#52764b"/><rect x="64" y="13" width="3" height="76" fill="#e3b36f"/>
  <path d="M7 25h9M26 28h10M46 34h8M64 30h10" stroke="#e8c78b" stroke-width="3"/>
 </pattern>
</defs>
<!-- library walls -->
<rect width="1600" height="1000" fill="url(#wall)"/>
<rect x="0" y="0" width="510" height="770" fill="#1b342b"/>
<rect x="0" y="0" width="510" height="690" fill="url(#books)"/>
