<rect x="720" y="0" width="22" height="560" fill="#31533d"/><rect x="1255" y="0" width="25" height="560" fill="#31533d"/>
<!-- hanging banner -->
<path d="M530 0h155v300l-77-42-78 42z" fill="#244d39" stroke="#82b96d" stroke-width="8"/>
<path d="M565 95h85v72l-42-30-43 30z" fill="none" stroke="#b5d98a" stroke-width="7"/>
