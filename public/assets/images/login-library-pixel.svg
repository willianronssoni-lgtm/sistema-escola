<rect x="30" y="700" width="220" height="62" fill="#315b43" stroke="#9bb86b" stroke-width="7"/><rect x="42" y="710" width="194" height="9" fill="#e4c18a"/>
<rect x="0" y="755" width="270" height="55" fill="#345a3d" stroke="#91ad62" stroke-width="7"/><rect x="18" y="764" width="230" height="8" fill="#e7c48d"/>
